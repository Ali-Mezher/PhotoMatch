{% extends "admin/base.html" %}
{% block title %}New event{% endblock %}
{% block content %}
<header class="page-header"><p class="eyebrow">Step 1 of 5</p><h1>Create an event</h1><p>Name the photo collection so workers can find it later.</p></header>
<section class="form-panel narrow-panel">
  <form action="{{ url_for('admin.create_event_route') }}" method="post" class="stack-form">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label>Event name<input name="title" value="{{ title or '' }}" maxlength="160" placeholder="Spring graduation" required><small>Use a name employees will recognize.</small></label>
    <label>Event date<input type="date" name="event_date" value="{{ event_date or '' }}" required><small>This helps keep the event list organized.</small></label>
    <div class="form-actions"><button class="button button-primary" type="submit">Create and add photos</button><a class="button button-quiet" href="{{ url_for('admin.overview') }}">Cancel</a></div>
  </form>
</section>
{% endblock %}
